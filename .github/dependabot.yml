# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The CLI and its tooling (package.json, yarn.lock).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Tooling only; a broken minor shows up in CI, not in what consumers install.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types track the oldest Node in package.json engines; newer types allow APIs that crash there.
      # Raise this pin together with engines.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # typescript-eslint declares typescript <6.1.0; lift this once it supports TypeScript 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 2
  # The Python shim only (pyproject.toml): its build backend and the Node runtime wheel.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 2
