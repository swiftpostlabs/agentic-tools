name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check version drift
        run: node scripts/checkVersionDrift.mts check

      - name: Verify tag matches repo version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match repo version $version" >&2
            exit 1
          fi

  publish_npm:
    needs: verify_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Publish npm package
        run: npm publish

  publish_python:
    needs: verify_release
    # The PyPI name agentic-tools belongs to an unrelated project; enable once the
    # shim's distribution name is chosen and its trusted publisher is configured.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build Python shim
        run: uv build --out-dir dist-python

      - name: Publish Python shim
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python
