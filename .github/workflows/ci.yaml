name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_test_lint_typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Lint and check generated files
        run: yarn lint
      - name: Type-check
        run: yarn typecheck
      - name: Run tests
        run: yarn test
      - name: Validate skills
        run: yarn validate
      - name: Validate npm package
        run: yarn run pack

  python_shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No node_modules here on purpose: the build hook must fetch the runtime
      # dependencies itself, as it does for a `uv add git+...` install.
      - name: Build the wheel from a bare checkout
        run: uv build --wheel --out-dir dist-python

      - name: Run the CLI through the shim
        run: |
          uv venv .venv-shim
          uv pip install --python .venv-shim dist-python/*.whl
          .venv-shim/bin/agentic-tools --help
          .venv-shim/bin/agentic-tools skills list --from .venv-shim/lib/python*/site-packages/agentic_tools/js > /dev/null

  dependabot-automerge:
    needs: [build_test_lint_typecheck, python_shim]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
