name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_test_lint_typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Lint and check generated files
        run: yarn lint
      - name: Type-check
        run: yarn typecheck
      - name: Run tests
        run: yarn test
      - name: Validate skills
        run: yarn validate
      - name: Validate npm package
        run: yarn run pack

  python_shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No node_modules here on purpose: the build hook must fetch the runtime
      # dependencies itself, as it does for a `uv add git+...` install.
      - name: Build the wheel from a bare checkout
        run: uv build --wheel --out-dir dist-python

      - name: Run the CLI through the shim
        run: |
          uv venv .venv-shim
          uv pip install --python .venv-shim dist-python/*.whl
          .venv-shim/bin/agentic-tools --help
          .venv-shim/bin/agentic-tools skills list --from .venv-shim/lib/python*/site-packages/agentic_tools/js > /dev/null

  # Node is the runtime the package declares; Bun must run the same code unchanged.
  bun_parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # Pinned so a Bun release cannot break main unannounced; bump it deliberately.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Run tests under Bun
        run: yarn test:bun
      - name: Compare Node and Bun output
        run: yarn check:runtimes

  dependabot-automerge:
    needs: [build_test_lint_typecheck, python_shim, bun_parity]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # SHA-pinned: this is the one step that runs with a write-scoped token.
      - name: Read the update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # An allow-list, so an update fetch-metadata cannot classify waits for a human. Patches
      # merge; minors only for development dependencies, since anything else ships to consumers.
      - name: Enable auto-merge for patches and development minors
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
          steps.metadata.outputs.dependency-type == 'direct:development')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
