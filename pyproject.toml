# Python launcher for the agentic-tools Node CLI, in the way pyright ships on PyPI: the
# implementation is TypeScript, and this package bundles it with a Node runtime so Python
# projects can `uv add` it. The version comes from package.json; see python/hatch_build.py
# for what the wheel carries.

[project]
name = "agentic-tools"
dynamic = ["version"]
description = "Shared agent skills and the agentic-tools CLI, packaged for Python projects."
authors = [{ name = "swiftpost", email = "swiftpostlab@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["nodejs-wheel-binaries>=24.19.0"]

[project.scripts]
agentic-tools = "agentic_tools.__main__:main"

[build-system]
requires = ["hatchling", "nodejs-wheel-binaries>=24.19.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "package.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["python/agentic_tools"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "python/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "python/",
  "src/",
  ".agents/skills/",
  "package.json",
  "yarn.lock",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
